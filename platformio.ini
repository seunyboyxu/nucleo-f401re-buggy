; PlatformIO Project Configuration File
;
; Nucleo F401RE - Mbed Framework (Mbed OS 5.15.4 / Mbed 2 compatible)
; Buggy Motor Control with QEI Encoders and C12832 LCD
;
; Pinned to Mbed OS 5.15.4 which supports classic Mbed 2 API:
;   Serial, wait_ms, wait, Ticker.attach(float), etc.

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = mbed

; Pin to Mbed OS 5.15.4 for Mbed 2 API compatibility
platform_packages =
    framework-mbed @ ~6.51504.0

; Upload via ST-Link (default for Nucleo boards)
upload_protocol = stlink

; Monitor serial output
monitor_speed = 9600

; Build flags
build_flags = 
    -Wno-deprecated-declarations
