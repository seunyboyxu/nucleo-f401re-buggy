; PlatformIO Project Configuration File
;
; Nucleo F401RE - Mbed Framework
; Buggy Motor Control with QEI Encoders and C12832 LCD
;
; Uses Mbed OS in bare-metal mode (no RTOS) with wait_us for delays.

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = mbed

; Upload via ST-Link (default for Nucleo boards)
upload_protocol = stlink

; Monitor serial output
monitor_speed = 9600

; Build flags
build_flags = 
    -Wno-deprecated-declarations
