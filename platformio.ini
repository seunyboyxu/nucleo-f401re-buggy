; PlatformIO Project Configuration File
;
; Nucleo F401RE - Baremetal with precompiled Mbed 2 (mbed-dev)
; Buggy Motor Control with QEI Encoders and C12832 LCD
;
; Uses precompiled libmbed.a from ARMmbed/mbed-dev (build 165)
; with headers-only library. No framework = mbed line needed.

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
; NO framework line - we supply our own Mbed 2 precompiled library

; Force LDF to find all libraries regardless of dependency resolution
lib_ldf_mode = deep+
lib_compat_mode = off

; Upload via ST-Link (default for Nucleo boards)
upload_protocol = stlink

; Monitor serial output
monitor_speed = 9600

; Custom linker script for STM32F401XE
board_build.ldscript = lib/mbed-dev/targets/TARGET_STM/TARGET_STM32F4/TARGET_STM32F401xE/device/TOOLCHAIN_GCC_ARM/STM32F401XE.ld

; Extra script to link libmbed.a with --whole-archive
extra_scripts = pre:extra_script.py

; Build flags: include paths + target/device defines
build_flags =
    -Wno-deprecated-declarations
    ; --- Include paths for Mbed 2 headers ---
    -Ilib/mbed-dev
    -Ilib/mbed-dev/drivers
    -Ilib/mbed-dev/platform
    -Ilib/mbed-dev/hal
    -Ilib/mbed-dev/hal/TARGET_FLASH_CMSIS_ALGO
    -Ilib/mbed-dev/hal/storage_abstraction
    -Ilib/mbed-dev/cmsis
    -Ilib/mbed-dev/cmsis/TARGET_CORTEX_M
    -Ilib/mbed-dev/target_headers
    -Ilib/mbed-dev/targets/TARGET_STM
    -Ilib/mbed-dev/targets/TARGET_STM/TARGET_STM32F4
    -Ilib/mbed-dev/targets/TARGET_STM/TARGET_STM32F4/TARGET_STM32F401xE
    -Ilib/mbed-dev/targets/TARGET_STM/TARGET_STM32F4/TARGET_STM32F401xE/TARGET_NUCLEO_F401RE
    -Ilib/mbed-dev/targets/TARGET_STM/TARGET_STM32F4/TARGET_STM32F401xE/device
    -Ilib/mbed-dev/targets/TARGET_STM/TARGET_STM32F4/TARGET_STM32F401xE/device/TOOLCHAIN_GCC_ARM
    ; --- Target defines ---
    -DTARGET_NUCLEO_F401RE
    -DTARGET_STM32F401xE
    -DTARGET_STM32F4
    -DTARGET_STM
    -DTARGET_CORTEX_M
    -DTARGET_CORTEX_M4
    -DTARGET_M4
    -DTARGET_CORTEX
    -DTARGET_LIKE_CORTEX_M4
    -DTARGET_LIKE_MBED
    -DTARGET_FF_ARDUINO
    -DTARGET_FF_MORPHO
    -D__CORTEX_M4
    -DARM_MATH_CM4
    -D__MBED__=1
    -DSTM32F401xE
    -D__FPU_PRESENT=1
    -D__CMSIS_RTOS
    ; --- Device feature defines (only define features that ARE present) ---
    -DDEVICE_SERIAL=1
    -DDEVICE_SERIAL_FC=1
    -DDEVICE_SERIAL_ASYNCH=1
    -DDEVICE_STDIO_MESSAGES=1
    -DDEVICE_PWMOUT=1
    -DDEVICE_ANALOGIN=1
    -DDEVICE_I2C=1
    -DDEVICE_I2CSLAVE=1
    -DDEVICE_I2C_ASYNCH=1
    -DDEVICE_SPI=1
    -DDEVICE_SPISLAVE=1
    -DDEVICE_SPI_ASYNCH=1
    -DDEVICE_INTERRUPTIN=1
    -DDEVICE_PORTIN=1
    -DDEVICE_PORTINOUT=1
    -DDEVICE_PORTOUT=1
    -DDEVICE_RTC=1
    -DDEVICE_SLEEP=1
    -DDEVICE_TRNG=1
    -DDEVICE_FLASH=1
    -DDEVICE_LPTICKER=1
    -DDEVICE_USTICKER=1
    ; --- Mbed config defines ---
    -DMBED_CONF_PLATFORM_DEFAULT_SERIAL_BAUD_RATE=9600
    -DMBED_CONF_PLATFORM_STDIO_BAUD_RATE=9600
    -DMBED_CONF_PLATFORM_STDIO_CONVERT_NEWLINES=0
    -DMBED_CONF_PLATFORM_STDIO_FLUSH_AT_EXIT=1
    -DMBED_CONF_DRIVERS_UART_SERIAL_TXBUF_SIZE=256
    -DMBED_CONF_DRIVERS_UART_SERIAL_RXBUF_SIZE=256
    ; --- Compiler flags ---
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
    -fno-exceptions
    -fno-rtti
    -std=gnu++98
